<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rebisco Raffle Draw</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rebisco-orange: #E94224;
    --rebisco-yellow: #FFD24C;
    --dark-bg: #111;
    --light-bg: #fff8f2;
    --color-light: #fff8f2;
    --glass-bg: rgba(255,255,255,0.15);
    --border-glow: rgba(255,255,255,0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: #fff;
    background: radial-gradient(circle at center, #1b1b1b 0%, #000 100%);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: background 1s ease;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(233,66,36,0.1), transparent 70%);
    pointer-events: none;
    animation: pulse 6s infinite alternate ease-in-out;
  }

  @keyframes pulse {
    from { opacity: 0.3; transform: scale(1); }
    to { opacity: 0.7; transform: scale(1.1); }
  }

  #prizeBox, #caption {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 1rem;
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }

  #nameBox {
    font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 700;
    background: var(--glass-bg);
    border: 2px solid var(--border-glow);
    border-radius: 20px;
    padding: 40px 60px;
    box-shadow: 0 0 40px rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);
    transition: all 0.6s ease;
    animation: fadeIn 1s ease;
    min-width: 60%;
    text-align: center;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.9); }
    to { opacity: 1; transform: scale(1); }
  }

  #batchList {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-top: 25px;
    max-width: 90%;
    z-index: 2;
  }

  .winner-item {
    background: var(--glass-bg);
    border: 2px solid var(--border-glow);
    padding: 10px 18px;
    border-radius: 10px;
    font-weight: bold;
    text-align: center;
    white-space: nowrap;
    color: var(--color-light);
    backdrop-filter: blur(12px);
  }

  .controls {
    position: absolute;
    bottom: 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  button {
    border: none;
    font-family: 'Poppins', sans-serif;
    padding: 14px 26px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-claim { background: var(--rebisco-orange); color: #fff; }
  .btn-noshow { background: #444; color: #fff; }
  .btn-next { background: var(--rebisco-yellow); color: #000; }
  .btn-start { background: var(--rebisco-orange); color: white; font-size: 18px; box-shadow: 0 4px 12px rgba(233,66,36,0.3); }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 14px rgba(0,0,0,0.3);
  }

  #infoText {
    position: absolute;
    bottom: 90px;
    font-size: 0.9rem;
    opacity: 0.8;
  }

  #confettiCanvas {
    position: fixed;
    inset: 0;
    z-index: -1;
  }

  #mode {
    position: fixed;
    bottom: 10px;
    right: 10px;
    color: white;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 10px;
    font-weight: 500;
    z-index: 1000;
    display: block;
  }

  .prizebox-Mod {
    font-size: 3rem !important;
  }

  .caption-Mod {
    margin-bottom: 0 !important;
    font-weight: 100 !important;
    margin-top: -15vh;
  }

  @media (max-width: 600px) {
    #nameBox { padding: 25px 30px; min-width: 80%; font-size: 2.2rem; }
    .winner-item { font-size: 0.9rem; padding: 6px 10px; }
    .controls { bottom: 20px; gap: 8px; }
    button { font-size: 14px; padding: 10px 18px; }
  }
</style>
</head>
<body>

<canvas id="confettiCanvas"></canvas>
<div class="overlay"></div>

<div id="caption" class="caption-Mod"></div>
<div id="prizeBox" class="prizebox-Mod">Preparing prize...</div>
<div id="nameBox">🎄 Waiting to Start 🎄</div>
<div id="batchList"></div>

<div class="controls">
  <button id="startDrawBtn" class="btn-start">Start Draw 🎯</button>
  <button id="claimBtn" class="btn-claim" style="display:none">Claim</button>
  <button id="noShowBtn" class="btn-noshow" style="display:none">No Show</button>
  <button id="nextBtn" class="btn-next" style="display:none">Next</button>
  <div id="mode"></div>
</div>

<div id="infoText"></div>

<script>
let attendees = JSON.parse(localStorage.getItem('attendeesData') || '[]');
let prizes = JSON.parse(localStorage.getItem('prizesData') || '[]');
let winners = JSON.parse(localStorage.getItem('winnersData') || '[]');
let selectedPrizeId = localStorage.getItem('selectedPrizeId');
let drawMode = localStorage.getItem('drawMode') || 'single';
let prize = prizes.find(p => p.id === selectedPrizeId);
let rollingInterval = null, currentPick = null;
let batchDrawing = false;
let drawInterval = 1000;

function loadBackground() {
  const bg = localStorage.getItem('raffleBgPath');
  if (bg) document.body.style.background = `url('${bg}') center/cover no-repeat fixed`;
}
loadBackground();
refreshFromStorage();
drawMode = localStorage.getItem('drawMode') || 'single';
document.getElementById('mode').textContent = drawMode == "batch" ? "Batch Draw" : "Single Draw";

function refreshFromStorage(){
  attendees = JSON.parse(localStorage.getItem('attendeesData') || '[]');
  prizes = JSON.parse(localStorage.getItem('prizesData') || '[]');
  winners = JSON.parse(localStorage.getItem('winnersData') || '[]');
  prize = prizes.find(p => p.id === selectedPrizeId);
  updatePrizeBox();
}

function showInfo(msg){ document.getElementById('infoText').textContent = msg; }

function startRollingOnce(callback){
  refreshFromStorage();
  const eligible = attendees.filter(a => !winners.find(w=>w.name===a.name));
  if(eligible.length === 0){ callback(null); return; }
  const finalPick = eligible[Math.floor(Math.random()*eligible.length)];
  rollingInterval = setInterval(()=>{
    const pick = eligible[Math.floor(Math.random()*eligible.length)];
    if(pick) document.getElementById('nameBox').textContent = pick.name;
  }, 60);
  setTimeout(()=>{
    clearInterval(rollingInterval);
    if(finalPick){
      document.getElementById('nameBox').textContent = '🎉 ' + finalPick.name + ' 🎉';
    }
    callback(finalPick);
  }, drawInterval);
}

function appendWinnerToList(winner){
  const item = document.createElement('div');
  item.className = 'winner-item';
  item.textContent = winner.name;
  document.getElementById('batchList').appendChild(item);
}

function performClaim(pick){
  if(!pick) return;
  selectedPrizeId = localStorage.getItem('selectedPrizeId');
  prize = prizes.find(p => p.id === selectedPrizeId);
  winners.push({ prizeId: prize.id, prizeName: prize.name, winnerId: pick.id, name: pick.name, category: pick.category });
  prize.drawCount = (parseInt(prize.drawCount)||0) + 1;
  attendees = attendees.filter(a => a.name !== pick.name);
  localStorage.setItem('winnersData', JSON.stringify(winners));
  localStorage.setItem('prizesData', JSON.stringify(prizes));
  localStorage.setItem('attendeesData', JSON.stringify(attendees));
  if(prize.totalWinners > 1) appendWinnerToList(pick);
  updatePrizeBox();
  window.opener && window.opener.postMessage({type:'raffle:update'}, '*');
}

function updatePrizeBox(){
  prize = prizes.find(p => p.id === selectedPrizeId);
  document.getElementById('caption').textContent = prize
  ? `${prize.totalWinners} ${prize.totalWinners > 1 ? 'Winners' : 'Winner'} of `
  : '';
  document.getElementById('prizeBox').textContent = prize ? `${prize.name}` : 'No prize';
}

function startAutoDraw(){
  stopConfetti(); // 🧹 Stop confetti at start of next draw
  refreshFromStorage();
  if(!prize){ document.getElementById('nameBox').textContent='Prize not found'; return; }
  if((+prize.drawCount||0) >= (+prize.totalWinners||0)){
    document.getElementById('nameBox').textContent='All winners drawn';
    document.getElementById('nextBtn').style.display='inline-block';
    updateNextButtonLabel(); return;
  }
  const eligible = attendees.filter(a => !winners.find(w=>w.name===a.name));
  if(!eligible.length){ document.getElementById('nameBox').textContent='No eligible attendees'; return; }
  document.getElementById('claimBtn').style.display='none';
  document.getElementById('noShowBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('batchList').innerHTML='';

  if(drawMode==='batch'){
    batchDrawing=true;
    const remaining=(+prize.totalWinners||0)-(+prize.drawCount||0);
    let drawn=0;
    function batchStep(){
      startRollingOnce((pick)=>{
        if(!pick){ batchDrawing=false; return; }
        performClaim(pick); drawn++;
        if(drawn<remaining){ setTimeout(batchStep,800); }
        else {
          batchDrawing=false;
          document.getElementById('nextBtn').style.display='inline-block';
          updateNextButtonLabel();
          launchConfetti(); // 🎉 Confetti starts and stays active
        }
      });
    } batchStep(); return;
  }
  startRollingOnce((pick)=>{
    if(!pick){ showInfo('No eligible'); return; }
    currentPick=pick;
    document.getElementById('claimBtn').style.display='inline-block';
    document.getElementById('noShowBtn').style.display='inline-block';
  });
}

function getNextPrize(seq){
  const sorted=prizes.slice().sort((a,b)=>(a.sequence||0)-(b.sequence||0));
  for(let i=0;i<sorted.length;i++){
    if(sorted[i].sequence===seq && i<sorted.length-1) return sorted[i+1];
    if(sorted[i].sequence>seq) return sorted[i];
  }
  return null;
}

document.getElementById('claimBtn').onclick=()=>{
  if(!currentPick)return;
  performClaim(currentPick);
  if((+prize.drawCount||0)<(+prize.totalWinners||0)){ currentPick=null; setTimeout(()=>startAutoDraw(),700); }
  else { document.getElementById('claimBtn').style.display='none'; document.getElementById('noShowBtn').style.display='none'; document.getElementById('nextBtn').style.display='inline-block'; updateNextButtonLabel(); }
};

document.getElementById('noShowBtn').onclick=()=>{
  currentPick=null; clearInterval(rollingInterval);
  setTimeout(()=>startAutoDraw(),700);
};

document.getElementById('nextBtn').onclick=()=>{
  const next=getNextPrize(prize.sequence);
  if(!next){ alert('No more prizes'); return; }
  localStorage.setItem('selectedPrizeId', next.id);
  selectedPrizeId=next.id; refreshFromStorage(); updatePrizeBox(); currentPick=null;
  document.getElementById('claimBtn').style.display='none';
  document.getElementById('noShowBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('batchList').innerHTML='';
  setTimeout(()=>startAutoDraw(),500);
};

function updateNextButtonLabel(){
  prize = prizes.find(p => p.id === selectedPrizeId);
  const next = getNextPrize(prize.sequence);
  document.getElementById('nextBtn').textContent = next ? `Next: ${next.name}` : 'No more prizes';
  updatePrizeBox();
}

document.getElementById('startDrawBtn').onclick=()=>{
  document.getElementById('startDrawBtn').style.display='none';
  startAutoDraw();
};

window.addEventListener('message',e=>{
  if(e.data && e.data.type==='raffle:update'){ refreshFromStorage(); updateNextButtonLabel(); }
});

window.addEventListener('beforeunload',()=>{
  localStorage.setItem('attendeesData',JSON.stringify(attendees));
  localStorage.setItem('prizesData',JSON.stringify(prizes));
  localStorage.setItem('winnersData',JSON.stringify(winners));
});

/* ---------- Confetti Effect ---------- */
const canvas=document.getElementById('confettiCanvas');
const ctx=canvas.getContext('2d');
let confetti=[]; let confettiActive=false;

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
window.addEventListener('resize',resize);resize();

function launchConfetti(){
  confetti=[];
  for(let i=0;i<150;i++){
    confetti.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height/2,
      r:Math.random()*6+2,c:`hsl(${Math.random()*360},100%,70%)`,v:Math.random()*2+2,a:1});
  }
  confettiActive=true;
}

function stopConfetti(){
  confettiActive=false;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function drawConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(confettiActive){
    confetti.forEach(p=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.c;
      ctx.globalAlpha=p.a;
      ctx.fill();
      p.y+=p.v;
      if(p.y>canvas.height)p.y=-10;
    });
    ctx.globalAlpha=1.0;
  }
  requestAnimationFrame(drawConfetti);
}
drawConfetti();
</script>
</body>
</html>
