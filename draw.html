<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Christmas Raffle - Draw</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial, background:#111;color:#fff;text-align:center;padding:20px;}
h1{color:#ffdd57;}
#prizeBox{margin-top:40px;font-size:48px;padding:30px;background:#222;border-radius:8px;min-height:80px;display:flex;align-items:center;justify-content:center;}
#nameBox{margin-top:600px;font-size:48px;padding:30px;background:#f95316;border-radius:8px;min-height:80px;display:flex;align-items:center;justify-content:center;}
.controls{margin-top:20px;}
button{padding:10px 16px;margin:6px;border-radius:6px;border:none;cursor:pointer;font-size:16px;}
.btn-claim{background:#28a745;color:#fff;}
.btn-noshow{background:#dc3545;color:#fff;}
.btn-next{background:#007bff;color:#fff;}
.small{font-size:14px;color:#bbb;margin-top:8px;}
.list{margin-top:20px;color:#9ae6b4;text-align:left;display:inline-block;min-width:300px;}
.winner-item{background:#1f2937;padding:8px;border-radius:6px;margin:6px 0;}
</style>
</head>
<body>


<div id="nameBox">Preparing...</div>
<div id="prizeBox"></div>
<button id="startDrawBtn" class="btn-claim"   style="margin-top:20px;padding:10px 20px;font-size:18px;">🎯 Start Draw</button>

<div class="controls">
  <button id="claimBtn" class="btn-claim" style="display:none">Claim</button>
  <button id="noShowBtn" class="btn-noshow" style="display:none">No Show</button>
  <button id="nextBtn" class="btn-next" style="display:none">Next</button>
</div>
<div class="small" id="infoText"></div>
<div class="list" id="batchList"></div>

<script>
// Load from storage
let attendees = JSON.parse(localStorage.getItem('attendeesData') || '[]');
let prizes = JSON.parse(localStorage.getItem('prizesData') || '[]');
let winners = JSON.parse(localStorage.getItem('winnersData') || '[]');
let selectedPrizeId = localStorage.getItem('selectedPrizeId');
let drawMode = localStorage.getItem('drawMode') || 'single'; // 'single' or 'batch'
let prize = prizes.find(p => p.id === selectedPrizeId);
let rollingInterval = null;
let currentPick = null;
let autoDrawTimeout = null;
let batchDrawing = false;
let drawInterval = 1 * 1000;


function loadBackground() {
    const bgPath = localStorage.getItem('raffleBgPath');
    if (bgPath) {
        document.body.style.background = `url('${bgPath}') no-repeat center center fixed`;
        document.body.style.backgroundSize = 'cover';
    } else {
        document.body.style.background = 'linear-gradient(135deg, #1a1a1a, #111)';
    }
}

// Call on page load
loadBackground();

function refreshFromStorage(){
  attendees = JSON.parse(localStorage.getItem('attendeesData') || '[]');
  prizes = JSON.parse(localStorage.getItem('prizesData') || '[]');
  winners = JSON.parse(localStorage.getItem('winnersData') || '[]');
  prize = prizes.find(p => p.id === selectedPrizeId);
}

function showInfo(text){ document.getElementById('infoText').textContent = text; }

function startRollingOnce(callback){
  refreshFromStorage();
  const eligible = attendees.filter(a => !winners.find(w=>w.name===a.name));
  if(eligible.length === 0){ callback(null); return; }
  rollingInterval = setInterval(()=>{
    const pick = eligible[Math.floor(Math.random()*eligible.length)];
    if(pick) document.getElementById('nameBox').textContent = pick.name;
  }, 60);
  setTimeout(()=>{
    clearInterval(rollingInterval);
    const pick = eligible[Math.floor(Math.random()*eligible.length)];
    callback(pick || null);
  }, drawInterval);
}

function appendWinnerToList(winner){
  const bl = document.getElementById('batchList');
  const item = document.createElement('div');
  item.className = 'winner-item';
  item.textContent = winner.name;
  bl.appendChild(item);
}

function performClaim(pick){
  if(!pick) return;
   selectedPrizeId = localStorage.getItem('selectedPrizeId'); // refresh current prize id
   prize = prizes.find(p => p.id === selectedPrizeId);         // reload current prize reference

  winners.push({ prizeId: prize.id, prizeName: prize.name, winnerId: pick.id, name: pick.name, category: pick.category });
  prize.drawCount = (parseInt(prize.drawCount)||0) + 1;
  attendees = attendees.filter(a => a.name !== pick.name);
  localStorage.setItem('winnersData', JSON.stringify(winners));
  localStorage.setItem('prizesData', JSON.stringify(prizes));
  localStorage.setItem('attendeesData', JSON.stringify(attendees));
  appendWinnerToList(pick);
  // update prizeBox header
  updatePrizeBox();
  window.opener && window.opener.postMessage({type:'raffle:update'}, '*');
}

function updatePrizeBox(){
   selectedPrizeId = localStorage.getItem('selectedPrizeId'); // refresh current prize id
   prize = prizes.find(p => p.id === selectedPrizeId);   
    document.getElementById('prizeBox').textContent = prize.name + ' — ' + prize.drawCount + '/' + prize.totalWinners;
}


function startAutoDraw(){
  refreshFromStorage();
  if(!prize){ document.getElementById('nameBox').textContent='Prize not found'; return; }
  // validation
  if((parseInt(prize.drawCount)||0) >= (parseInt(prize.totalWinners)||0)){
    document.getElementById('nameBox').textContent = 'All winners for this prize already drawn.';
    showInfo('Close this tab or press Next to continue.');
    document.getElementById('nextBtn').style.display='inline-block';
    updateNextButtonLabel();
    return;
  }
  const eligible = attendees.filter(a => !winners.find(w=>w.name===a.name));
  if(eligible.length === 0){
    document.getElementById('nameBox').textContent='No eligible attendees left.';
    showInfo('Nothing to draw. Close tab or press Next.');
    document.getElementById('nextBtn').style.display='inline-block';
    return;
  }

  document.getElementById('claimBtn').style.display='none';
  document.getElementById('noShowBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';

  document.getElementById('batchList').innerHTML = '';

  if(drawMode === 'batch'){
    batchDrawing = true;
    showInfo('Batch drawing all remaining winners for this prize...');
    const remaining = (parseInt(prize.totalWinners)||0) - (parseInt(prize.drawCount)||0);
    let drawn = 0;
    function batchStep(){
      startRollingOnce((pick)=>{
        if(!pick){
          showInfo('No more eligible attendees.');
          batchDrawing = false;
          document.getElementById('nextBtn').style.display='inline-block';
          updateNextButtonLabel();
          return;
        }
        // Auto-claim behavior: if prize.auto_claim==1, we still claim (batch auto-claims)
        performClaim(pick);
        drawn++;
        if(drawn < remaining){
          setTimeout(batchStep, 800);
        } else {
          batchDrawing = false;
          showInfo('Batch draw complete. Press Next to proceed.');
          document.getElementById('nextBtn').style.display='inline-block';
          updateNextButtonLabel();
        }
      });
    }
    batchStep();
    return;
  }

  // single draw mode
  showInfo('Auto drawing... will stop after 3 seconds.');
  startRollingOnce((pick)=>{
    if(!pick){
      document.getElementById('nameBox').textContent='No eligible attendees.';
      document.getElementById('nextBtn').style.display='inline-block';
      updateNextButtonLabel();
      return;
    }
    currentPick = pick;
    document.getElementById('nameBox').textContent = '🎉 ' + pick.name + ' 🎉';
    if(prize.auto_claim && parseInt(prize.auto_claim) === 1){
      performClaim(currentPick);
      if((parseInt(prize.drawCount)||0) < (parseInt(prize.totalWinners)||0)){
        setTimeout(()=> startAutoDraw(), 800);
      } else {
        showInfo('All winners for this prize have been drawn (auto-claimed). Press Next to continue.');
        document.getElementById('nextBtn').style.display='inline-block';
        updateNextButtonLabel();
      }
    } else {
      document.getElementById('claimBtn').style.display='inline-block';
      document.getElementById('noShowBtn').style.display='inline-block';
      showInfo('Press Claim to confirm winner (increments draw count). Press No Show to redraw (not counted).');
    }
  });
}

function getNextPrize(seq){
  const sorted = prizes.slice().sort((a,b)=> (a.sequence||0)-(b.sequence||0));
  for(let i=0;i<sorted.length;i++){
    if(sorted[i].sequence === seq && i < sorted.length-1) return sorted[i+1];
    if(sorted[i].sequence > seq) return sorted[i];
  }
  return null;
}

document.getElementById('claimBtn').addEventListener('click', ()=>{
  if(!currentPick) return;
  performClaim(currentPick);
  if((parseInt(prize.drawCount)||0) < (parseInt(prize.totalWinners)||0)){
    currentPick = null;
    setTimeout(()=> startAutoDraw(), 700);
  } else {
    showInfo('All winners drawn for this prize. Press Next to continue.');
    document.getElementById('claimBtn').style.display='none';
    document.getElementById('noShowBtn').style.display='none';
    document.getElementById('nextBtn').style.display='inline-block';
    updateNextButtonLabel();
  }
});

document.getElementById('noShowBtn').addEventListener('click', ()=>{
  showInfo('No show — drawing again (this draw is not counted).');
  currentPick = null;
  if(autoDrawTimeout) clearTimeout(autoDrawTimeout);
  if(rollingInterval) clearInterval(rollingInterval);
  setTimeout(()=> startAutoDraw(), 700);
});

document.getElementById('nextBtn').addEventListener('click', ()=>{
  const next = getNextPrize(prize.sequence);
  if(!next){ alert('No more prizes. Close this tab.'); return; }
  localStorage.setItem('selectedPrizeId', next.id);
  // keep drawMode (single/batch) as default 'single' when moving next
  selectedPrizeId = next.id;
  refreshFromStorage();
  updatePrizeBox();
  currentPick = null;
  document.getElementById('claimBtn').style.display='none';
  document.getElementById('noShowBtn').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('batchList').innerHTML = '';
  setTimeout(()=> startAutoDraw(), 500);
});

function updateNextButtonLabel(){
  refreshFromStorage();
  prize = prizes.find(p => p.id === selectedPrizeId);
  const next = getNextPrize(prize.sequence);
  const btn = document.getElementById('nextBtn');
  if(next) btn.textContent = 'Next: ' + next.name;
  else btn.textContent = 'No more prizes';
  // update prizeBox too
  document.getElementById('prizeBox').textContent = prize ? (prize.name + ' — ' + prize.drawCount + '/' + prize.totalWinners) : 'Prize not selected';
}

// // start on load automatically
updateNextButtonLabel();
// setTimeout(()=> startAutoDraw(), 300);


document.getElementById('startDrawBtn').addEventListener('click', () => {
  console.log(1);

    startAutoDraw();
    // optionally hide the button once clicked
    document.getElementById('startDrawBtn').style.display = 'none';
});

window.addEventListener('message', (e)=>{
  // refresh if parent updated cache
  if(e.data && e.data.type === 'raffle:update'){
    refreshFromStorage();
    updateNextButtonLabel();
  }
});

window.addEventListener('beforeunload', ()=> {
  localStorage.setItem('attendeesData', JSON.stringify(attendees));
  localStorage.setItem('prizesData', JSON.stringify(prizes));
  localStorage.setItem('winnersData', JSON.stringify(winners));
});
</script>
</body>
</html>
